<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Almitest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d3557">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/icons/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almitest">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body>
<div id="app">
  <header>
    <button class="back-btn" id="btn-back" title="Volver a mis oposiciones">←</button>
    <div class="htext">
      <h1 id="opo-title">Cargando…</h1>
      <div class="sub" id="opo-sub"></div>
    </div>
  </header>

  <div id="screen-home" class="screen"><div class="loading">Cargando preguntas…</div></div>
  <div id="screen-quiz" class="screen hidden"></div>
  <div id="screen-result" class="screen hidden"></div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-nav="home"><span class="ic">🏠</span>Inicio</button>
    <button class="nav-btn" data-nav="repaso"><span class="ic">🔁</span>Fallos</button>
    <button class="nav-btn" data-nav="stats"><span class="ic">📊</span>Progreso</button>
  </div>
</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/quiz.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>

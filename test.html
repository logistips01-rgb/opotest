<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Almitest</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15403a" media="(prefers-color-scheme: dark)">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/icons/favicon-48.png" sizes="48x48">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almitest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/base.css">
</head>
<body class="pg-test">
<div id="app">
  <header>
    <button class="back-btn" id="btn-back" title="Volver a mis oposiciones" aria-label="Volver a mis oposiciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="htext">
      <h1 id="opo-title">Cargando…</h1>
      <div class="sub" id="opo-sub"></div>
    </div>
  </header>

  <div id="screen-home" class="screen"><div class="loading">Cargando preguntas…</div></div>
  <div id="screen-quiz" class="screen hidden"></div>
  <div id="screen-result" class="screen hidden"></div>

  <div class="bottom-nav">
    <button class="nav-btn active" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Temas</button>
    <button class="nav-btn" data-nav="repaso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"/><path d="M18 3v4h-4M6 21v-4h4"/></svg>Fallos</button>
    <button class="nav-btn" data-nav="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Progreso</button>
  </div>
</div>

<script src="assets/js/storage.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/quiz.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
